<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Break Challenge</title>
  </head>
  <body>
    <h1>Break Challenge</h1>
    <script>
      function checkPrime() {
        let num = Number(prompt("Please enter any number: "));
        let isPrime = true;

        if (num <= 1) {
          isPrime = false;
        } else {
          for (let i = 2; i < num; i++) {
            if (num % i === 0) {
              isPrime = false; //a factor has been found
              break; //stop looking
            }
          }
        }
        if (isPrime) {
          alert(`${num} is a prime number`);
        } else {
          alert(`${num} is NOT a prime number`);
        }
      }
      checkPrime();
    </script>
  </body>
</html>
