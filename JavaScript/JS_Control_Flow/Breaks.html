<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Breaks</title>
  </head>
  <body>
    <h1>Breaks</h1>
    <script>
      while (true) {
        let num = Number(prompt("Enter a number: "));
        alert(num);
        if (num == 0) {
          break;
        }
      }
    </script>
  </body>
</html>
