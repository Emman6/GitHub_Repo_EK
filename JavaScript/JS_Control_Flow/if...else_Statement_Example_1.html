<!doctype html>
<html>
  <body>
    <script>
      console.log(`Program to check if a number is positive`);
      alert(`program to see if the number is positive`);
      let continueRunning = true;

      while (continueRunning) {
        //Prompting the user to input a number
        const input = prompt(
          `Please enter any number (or type 'exit' to quit)😊: `,
        );
        //Does the user want to exit the program?
        if (input === null || input.toLowerCase() === `exit`) {
          continueRunning = false;
          alert(`Thanks - you are now exiting the program 👋🏾`);
          break;
        }

        const number = Number(input);

        //check if the number is a valid finite number
        if (Number.isFinite(number)) {
          //If it is indeed finite do the following:
          if (number > 0) {
            alert(`😀 "${number}" is a positive number`);
          } else if (number < 0) {
            alert(`🫨"${number}" is a negative number`);
          } else {
            alert(`🤨 I believe you entered a zero`);
          }
        } else {
          //This happens if the number is not finite
          alert(
            `"${input}" is not a valid (finite) number. Please try again.😔`,
          );
        }
      }
    </script>
  </body>
</html>
